[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zagros"
version = "0.3.0"
description = "Persian-first console for learning Python: correct RTL/bidi output, Persian error doctor, zero dependencies."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "tirotir" }]
keywords = ["persian", "farsi", "rtl", "bidi", "console", "terminal", "education", "python"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: OS Independent",
  "Natural Language :: Persian",
  "Topic :: Education",
  "License :: OSI Approved :: MIT License",
]
dependencies = []

[project.urls]
Homepage = "https://tirotir.com"

[project.scripts]
zagros = "zagros.cli:main"

[project.gui-scripts]
zagros-gui = "zagros.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
zagros = ["web/*"]
